name: CI

# Build + test on every master push / PR: Linux clang Debug, Linux gcc Debug (the
# house battery is BOTH compilers), and Windows MSVC Debug (D3D12 + WebGPU coverage).
# Release distribution lives in release.yml. Peak-memory notes: a single modules TU
# can need several GB; the swapfile step is OOM insurance, and lavapipe (software
# Vulkan) lets device-creating tests run headless.

permissions:
  contents: read # build + test only; nothing here publishes

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'Documentation/**', 'comments-cleanup.md']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'Documentation/**', 'comments-cleanup.md']
  workflow_dispatch: {}

# Supersede an in-flight run for the same ref (saves minutes on a private repo).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-clang:
    name: Linux / clang / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # a cold modules build is slow; the cache warms subsequent runs
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower to 2 (or 1) if the modules build OOMs
    steps:
      - uses: actions/checkout@v4

      # The C++23-modules build writes a large volume of .pcm + object files and can exhaust the
      # runner's root disk (the previous run died at ~87% with "No space left on device"). Reclaim
      # the ~20-25 GB of preinstalled toolchains we do not use (Android SDK, .NET, GHC, CodeQL,
      # Swift, PowerShell) before building. df prints before/after so the headroom is visible.
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      # Build + runtime deps (mirrors README "Ubuntu / Debian"). mesa-vulkan-drivers
      # gives lavapipe (software Vulkan) so device-creating tests can run headless.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang pkg-config ccache xvfb \
            libvulkan-dev vulkan-tools vulkan-validationlayers mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
          cmake --version

      # Ubuntu 24.04 ships Clang 18, but the codebase targets a current Clang (the dev toolchain
      # is 21) - e.g. -Wno-c2y-extensions is unknown to Clang 18 and, under -Werror, fails the
      # build, and Clang 18's C++23-modules support is weaker. Install Clang 21 from apt.llvm.org;
      # the Configure step selects the versioned clang++-21 binary explicitly (see there).
      - name: Install Clang 21 (match the dev toolchain)
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          clang++-21 --version   # fail loudly here if the install did not produce the binary

      # SDL3 is vendored as source (ThirdParty/SDL3) and built statically in-tree, so there is no
      # SDL to install here - only its build deps (the X11/Wayland/audio -dev packages above),
      # which the source build compiles against.

      # OOM insurance for the memory-heavy modules build: a large swapfile means a
      # spike gets paged instead of OOM-killed (slower, but the job survives). The runner
      # already ships an active /swapfile, so disable and remove it first (fallocate on the
      # in-use file fails "Text file busy"), then create the larger one on the roomy /mnt disk.
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # ccache caches the many non-module ThirdParty TUs (ThirdParty is ~46% of a
      # clean build). Module units may not cache, but this still cuts the biggest cost.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-clang-debug
          max-size: 2G

      - name: Configure
        # Override the preset's CMAKE_CXX_COMPILER ('clang++') with the versioned Clang 21 binary.
        # A command-line -D beats the preset cache var (and beats CC/CXX env), so this does not
        # depend on update-alternatives having repointed /usr/bin/clang++. ASM uses the CXX driver.
        run: >
          cmake --preset clang
          -DCMAKE_C_COMPILER=clang-21
          -DCMAKE_CXX_COMPILER=clang++-21
          -DCMAKE_ASM_COMPILER=clang++-21
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset clang

      # Run the doctest suites under a virtual X server; VK_ICD points the loader at
      # lavapipe so any test that creates a real Vulkan device works without a GPU.
      # --timeout bounds any single suite (all run in seconds) so a hang fails that test fast
      # instead of blocking the whole job until the 180-minute job timeout.
      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a ctest --preset clang --output-on-failure --timeout 300 --no-tests=error

      - name: ccache stats
        if: always()
        run: ccache -s

  linux-gcc:
    name: Linux / gcc / Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          df -h /
      # A change is done only when BOTH compilers build and test green - a GCC-only
      # diagnostic or libstdc++ divergence must fail CI, not the human's local run. The dev
      # toolchain is GCC 15; the toolchain-r PPA carries it for noble - fall back to g++-14
      # if the PPA lags (the fallback may be below the modules floor; the job will say so
      # loudly rather than silently skipping gcc coverage).
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          if apt-cache show g++-15 >/dev/null 2>&1; then GXX_VER=15; else GXX_VER=14; fi
          echo "GXX_VER=$GXX_VER" >> "$GITHUB_ENV"
          echo "Using g++-$GXX_VER"
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++-$GXX_VER pkg-config ccache xvfb \
            libvulkan-dev vulkan-tools vulkan-validationlayers mesa-vulkan-drivers \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev libasound2-dev
      - name: Add swap headroom
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 12G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-gcc-debug
          max-size: 2G
      - name: Configure
        run: >
          cmake --preset gcc
          -DCMAKE_C_COMPILER=gcc-${{ env.GXX_VER }}
          -DCMAKE_CXX_COMPILER=g++-${{ env.GXX_VER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset gcc
      - name: Test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: xvfb-run -a ctest --preset gcc --output-on-failure --timeout 300 --no-tests=error
      - name: ccache stats
        if: always()
        run: ccache -s

  # Windows build + test with MSVC. This covers the D3D12 backend (which the Linux job cannot
  # exercise) plus WebGPU and the headless/logic suites. No Vulkan SDK is installed, so
  # find_package(Vulkan) fails and RHI.Vulkan + the Vulkan-only Render.Backend.Tests are skipped by
  # design (Vulkan is the Linux job's coverage). SDL3 is vendored source and builds static in-tree,
  # and DXC/wgpu ship as Windows prebuilts in ThirdParty - so there is nothing to install beyond the
  # toolchain. Independent of the Linux job; a Windows failure does not cancel Linux.
  windows-msvc:
    name: Windows / MSVC / Debug
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4' # lower to 2 if the modules build OOMs on the 16 GB runner
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1 # puts cl + the Windows SDK on PATH for the later steps
      - name: Install Ninja
        run: choco install ninja -y # the msvc preset uses the Ninja generator (C++20 modules)
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset msvc
      # Device-creating suites run against whatever headless adapter Windows provides (D3D12 WARP);
      # ones with no software path skip themselves. --timeout bounds any hang.
      - name: Test
        run: ctest --preset msvc --output-on-failure --timeout 300 --no-tests=error
